name: verdant
description: ESG Compliance Platform for European SMEs — Verdai
version: 1.0.0+1
publish_to: "none"

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  supabase_flutter: ^2.3.0
  flutter_stripe: ^10.1.1

  flutter_riverpod: ^2.4.10
  riverpod_annotation: ^2.3.4

  go_router: ^13.2.0

  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0

  fl_chart: ^0.67.0

  pdf: ^3.10.8
  printing: ^5.12.0

  file_picker: ^8.0.0
  excel: ^4.0.3

  intl: ^0.20.2
  uuid: ^4.3.3
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.5
  cached_network_image: ^3.3.1
  lottie: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  riverpod_generator: ^2.3.9
  build_runner: ^2.4.8
  flutter_lints: ^3.0.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/templates/
